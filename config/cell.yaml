# The robot cell, for the lab's stack `kinova_controller_pkgs` (ROS 2 Jazzy).
# EVERY value marked CALIBRATE must be measured on the real cell before `insert`.
#
# THE SHELF FRAME: origin on the shelf floor at the left edge of column 0 (the
# simulator's world), z up, the shelf plane is x-z, the LEFT arm stands at -y,
# the RIGHT arm at +y. The shelf has no front and no back panel: one tool
# reaches the piece from each side.
#
# THE ARMS AND THE ATIs (2026-10-21, GUIDA.md T1 = launch/robot.launch.py): the lab's
# kinova_controller.py of ~/ros2_ws (kinova_controller_pkgs, as in the 15-20/10 runs), one per arm
# in /left_arm (.200) and /right_arm (.107): home in impedance, then Cartesian impedance on
# end_effector_link (= the flange) of urdf/gen3_ati_tool.urdf = gen3.urdf + the 150 g bolted on
# the flange (ATI, adapters, spring, tri-pad). NOT tele_ros2's controller (faulted the .200 twice
# on 2026-10-21). Stiffness diagonal in the BASE axes, fixed at launch (`check` prints it).
# ft_raw of tele_ros2 (from its source) per arm: the cells are mounted the other way round from
# tele_ros2's map: left .200 has the .132, right .107 the .131.

# THE REAL PIECES ARE 100 mm CUBES, the routes were trained on 120 mm: every position
# is scaled about the slot (PyBullet, 3 worlds: all still seat, real tri-pad included).
# Build the board at this scale too: the route files' neighbours are scaled on load.
scale: 0.8333333
piece_mass: 0.050         # [kg] whole real polystyrene tetromino: 50 g (Lorenzo, 2026-10-20).

rate_hz: 100              # control loop and command stream [Hz]
log_dir: logs
max_reach: 0.902          # [m] Kinova Gen3 7-DoF reach, for `check` only
f_abort: 60.0             # [N] per hand: stop streaming above this (robot-only safety)
track_abort: 0.040        # [m] stop if a flange is this far from its target beyond F / KP
jam_scale: 1.8            # x the jam sentry's side-force limit (1.0 = as trained). Lorenzo,
                          # 2026-10-16: stiffer springs, the piece must push its neighbours
jam_min: 8.0              # [N] floor of the jam limit. The new SOCP asks ~1 N, so the limit
                          # falls to this floor, below the estimate's noise (2026-10-19, I: 6.5 N at rest)
allow_hand_wrench: false  # hwd routes chase wrench MOMENTS: enable only once they are verified

# THE FULL-WRENCH SOCP (2026-10-19, this copy only). Cost = the human precision on the
# two flange wrenches (Vitus-inspired Sigma^-1), cones per point; no separate floor/cap/slack.
socp:
  margin_mode: task_adaptive  # friction_cone.pdf eq. 3-8 + general task map (appendix).
  margin_task_scale: 0.25     # dimensionless: rho_task = scale*||F_task|| + floor_N.
  margin_floor_N: 1.0         # [N] TASK-level floor, distributed to ACTIVE POINTS by ||(G^+G)_i||_2.
                             # 2026-10-20: raised from 0.5 for more airborne grip on the 50 g piece.
                             # Dry-run T: 3.49 N/hand to_mouth, median 4.18 N/hand overall; not calibrated bounds.
  margin_fixed_N: 0.5         # [N/point] used ONLY by margin_mode: fixed (comparison).
                             # ||ft_i|| <= mu*N_i - rho_i*sqrt(1+mu^2); no 0.7 multiplier.
  w_force: 0.0            # effort term weight; 0 = human precision only, 1 = Codex's effort + prior
  no_bending: false       # true = no moment across each pad plane (a tilt-compliant tool)
full_wrench: false        # true (or `--twist` on the command line) = regulate the internal flange wrench on EVERY route.
                          # 2026-10-21: needs wrench_source: ft on both arms (main.py refuses otherwise)
full_wrench_channels: twist   # twist = squeeze + opposite twist only; internal = the old hwd law
full_wrench_moment_sign: -1  # -1 = the original law. 2026-10-20 (estimated wrench, logs 19:41 19:45 with -1,
                             # 19:55 with +1): both signs drove the twist offset to its cap (~5 deg) with the
                             # twist error unchanged (~0.5 Nm), so neither is shown right. Recheck with the ATIs:
                             # the error must shrink while the offset grows, or flip it.
# ONLY for wrench_source: estimated. An empty-handed `wrench_log` CSV along the route: each
# hand's force corrected by it at the nearest flange position (ros_backend.py). The ATI
# needs none. Old ones: Z logs/wrench_20261016_134246_Z_senza_contatto.csv, T logs/wrench_20261016_112659.csv
wrench_baseline: null

stiffness:                # what the controllers are LAUNCHED with (`check` prints the cart_k).
  trans: 1000.0           # [N/m]   the routes were trained at 1500 N/m, 40 Nm/rad torsion, 8 tilt
  torsion: 20.0           # [Nm/rad] about the push axis; 20 = the real runs since 2026-10-16
  tilt: 20.0              # [Nm/rad] the other two

# THE REAL TOOL (Lorenzo, 2026-10-16): a printed flange, a 50 mm spring, then a tri-pad
# like PyBullet's: three spheres of radius 15 mm centred on the vertices of a 70 mm
# triangle. No sponge on the contact face (if any, only around the spring): the three
# spheres ARE the three contact points of the SOCP. CALIBRATE: measure and write here.
tool:
  # Lorenzo, 2026-10-21, both arms alike: WITH THE ATI each tool sticks out 100 mm from its
  # flange to the front of the spheres (70 mm before the ATI). Only the sum pad_x + pad_r
  # places the contact; the spring is taken as rigid (geometry.pad_contacts: the tri-pad
  # pose is the flange pose).
  # THE SPRING (Lorenzo, 2026-10-21): k = 2700 N/m axial, coil diameter 17 mm, 50 mm long,
  # FREE (no guide, no sponge); spring + tri-pad 40 g. Rough numbers (steel coil, E/G = 2.6):
  # series with the 1000 N/m impedance -> 730 N/m per hand; 2.2 mm shorter at 6 N; bending
  # ~0.11 Nm/rad, twist ~0.25 Nm/rad (the wrist: 20); sideways ~100 N/m at the pad (~10 Hz
  # with 40 g); buckling from ~10 N per hand if the pad slides sideways freely. The spring
  # passes FORCES: a moment about the flange is only those forces times their arm.
  pad_x: 0.085            # [m] tool origin (flange) to the plane of the sphere centres = 0.100 - pad_r
  pad_r: 0.015            # [m] sphere radius
  r_tri: 0.0404           # [m] sphere centres' circle: 70 mm triangle side / sqrt(3) (the sim had 30 mm).
                          # TO CHECK: Lorenzo also said "inscribed in a 35 mm circle", which is a
                          # 60.6 mm side: measure two sphere centres apart (70 -> 0.0404, 60.6 -> 0.035)

left:
  base_frame: base_link
  ee_frame: end_effector_link            # the frame the controller drives (= the flange; ee_frame:= in GUIDA T1)
  # the URDF the controller runs: the forward kinematics here must be the same
  urdf_path: /home/nvidia/lorenzo/kinova_dual_arm_dmp_insertion_fullwrench/urdf/gen3_ati_tool.urdf   # = left_urdf/right_urdf of the launch: gen3.urdf + the 150 g ATI tool
  target_topic: /left_arm/target_pose
  joint_states_topic: /left_arm/joint_states
  wrench_topic: /left_arm/estimated_wrench   # from the joint torque sensors, not an F/T
  zero_wrench_service: /left_arm/zero_wrench
  # THE WRIST ATI (2026-10-21): NetBox .132 (Mini40 SI-80-4, FT54940, N / Nm), ft_raw in this
  # arm's namespace (GUIDA.md T1). Lorenzo: at Home ATI +z = Kinova +X, +x = +Y -> ee axes.
  wrench_source: ft                      # ft = the ATI; estimated = the joint torques (logged anyway)
  ft_topic: /left_arm/ft_data_avg            # sensor axes, means of 5 raw samples (ati_node.py)
  ft_rate_hz: 200                            # its rate: 1000 / ft_every
  ft_calibration_service: /left_arm/ft_raw/get_calibration   # units, read at start (lbf would be converted)
  # the sensor frame in end_effector_link: rotation from `ft_check --calibrate`, xyz = the
  # sensor origin (only moves the moment origin, not the twist about the pad axis)
  ft_in_ee: {xyz: [0.0, 0.0, 0.0], quat: [0.0, 0.0, 0.0, 1.0]}
  ft_sign: 1.0                           # from `ft_check --calibrate`
  tool_mass: 0.040        # [kg] what hangs on the sensor: spring + tri-pad 40 g (Lorenzo); WEIGH
                          # with the adapter past the sensor and put it in local.yaml (GUIDA 2a)
  tool_com_in_ft: [0.0, 0.0, 0.03]       # [m] its centre of mass, sensor axes (on the axis, ~ half the tool)
  shoulder_in_base: [0.0, 0.0, 0.2848]
  # the pose of the SHELF frame in this arm's base_link, measured by hand (Lorenzo,
  # 2026-10-15, see `right`): from .200 the near floor corner is at x 175, y -240,
  # z -30 mm; the shelf is 125 mm deep, so its centre plane is at y -302.5
  shelf_in_base: {xyz: [0.7475, -0.3025, -0.03], quat: [0.0, 0.0, 1.0, 0.0]}   # x: see `right`
  # our tool frame (x = push direction, origin at the flange centre) in end_effector_link:
  # x_tool = z_ee, a -90 deg turn about y. Add the mount thickness along z_ee if any.
  tool_in_ee: {xyz: [0.0, 0.0, 0.0], quat: [0.0, -0.7071068, 0.0, 0.7071068]}

right:
  base_frame: base_link
  ee_frame: end_effector_link
  urdf_path: /home/nvidia/lorenzo/kinova_dual_arm_dmp_insertion_fullwrench/urdf/gen3_ati_tool.urdf   # = left_urdf/right_urdf of the launch: gen3.urdf + the 150 g ATI tool
  target_topic: /right_arm/target_pose
  joint_states_topic: /right_arm/joint_states
  wrench_topic: /right_arm/estimated_wrench
  zero_wrench_service: /right_arm/zero_wrench
  # THE WRIST ATI (2026-10-21): NetBox .131 (Mini40 SI-80-4, FT49595, N / Nm on 2026-10-21),
  # ft_raw in this arm's namespace (GUIDA.md T1). Mounted as the left one: ee axes.
  wrench_source: ft                      # ft = the ATI; estimated = the joint torques (logged anyway)
  ft_topic: /right_arm/ft_data_avg            # sensor axes, means of 5 raw samples (ati_node.py)
  ft_rate_hz: 200                             # its rate: 1000 / ft_every
  ft_calibration_service: /right_arm/ft_raw/get_calibration   # units, read at start (lbf would be converted)
  # the sensor frame in end_effector_link: rotation from `ft_check --calibrate`, xyz = the
  # sensor origin (only moves the moment origin, not the twist about the pad axis)
  ft_in_ee: {xyz: [0.0, 0.0, 0.0], quat: [0.0, 0.0, 0.0, 1.0]}
  ft_sign: 1.0                           # from `ft_check --calibrate`
  tool_mass: 0.040        # [kg] what hangs on the sensor: spring + tri-pad 40 g (Lorenzo); WEIGH
                          # with the adapter past the sensor and put it in local.yaml (GUIDA 2a)
  tool_com_in_ft: [0.0, 0.0, 0.03]       # [m] its centre of mass, sensor axes (on the axis, ~ half the tool)
  shoulder_in_base: [0.0, 0.0, 0.2848]
  # measured by hand (Lorenzo, 2026-10-15): bases parallel, 600 mm apart; the shelf floor
  # runs from x 175 to 825 mm in front of both bases, 30 mm below them; from .107 its near
  # floor corner is at y +235, so with a 125 mm deep shelf the centre plane is at y +297.5.
  # The 650 mm floor holds the simulated 646 mm between the end walls, centred on x 500:
  # column 0 (the shelf origin) is the FAR end, x 807.5, turned 180 deg about z.
  # MOVED after that: the board is 60 mm closer to the bases, column 0 at x 747.5. That is the
  # value of the successful runs of 19/10 (L) and 20/10 (T twist) (their profiles in docs/runs);
  # it was a local change on the robot PC, restored here on 2026-10-21.
  shelf_in_base: {xyz: [0.7475, 0.2975, -0.03], quat: [0.0, 0.0, 1.0, 0.0]}
  tool_in_ee: {xyz: [0.0, 0.0, 0.0], quat: [0.0, -0.7071068, 0.0, 0.7071068]}
